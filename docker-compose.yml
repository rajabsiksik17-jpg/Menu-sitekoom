# One small server (VPS): PostgreSQL + the menu platform + Caddy (automatic HTTPS with Let's Encrypt).
# Usage: cp .env.example .env  (edit it)  →  docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: menu
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu -d menu"]
      interval: 10s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://menu:${POSTGRES_PASSWORD}@db:5432/menu
      DATA_DIR: /data
    volumes:
      - media:/data
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MENU_DOMAIN: ${MENU_DOMAIN:?set MENU_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
